[project]
name = "dsci41-traffic-intelligence"
version = "0.1.0"
description = "DSCI-41: Traffic volume estimation and short-term congestion forecasting from roadside video"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    # Computer vision
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3",        # AGPL-3.0 — see RISK_REGISTER R-09
    "lap>=0.5.12",             # linear assignment for Ultralytics ByteTrack (BSD-2)
    "opencv-python-headless>=4.10",
    # Data / ML
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    # Backend
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    # Frontend
    "streamlit>=1.38",
    "plotly>=5.24",
    # Telemetry
    "psutil>=6.0",
]

[project.optional-dependencies]
openvino = ["openvino>=2024.4"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

# CPU-only PyTorch wheels (no CUDA on the development machine; see PROJECT_ANALYSIS §5)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (model inference, video processing)",
    "acceptance: AC-1..AC-4 acceptance harness",
    "negative: NT-1..NT-5 negative tests",
    "needs_data: requires downloaded datasets under DATA_ROOT",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # long literal fixtures (XML)
