# Deploy the dashboard to a Hugging Face Space on every push to main that touches the app.
#
# One-time setup (in this GitHub repository: Settings -> Secrets and variables -> Actions):
#   - Secret   HF_TOKEN : a Hugging Face access token with WRITE permission
#   - Variable HF_SPACE : the Space id, e.g. "your-hf-username/roadside-traffic-intelligence"
# HF_SPACE may also be stored as a secret. If either setting is missing the run fails with an explanation.
name: Sync Hugging Face Space

on:
  # Manual only. The simpler default deployment is deploy/hf_space/Dockerfile.remote (no tokens needed).
  workflow_dispatch:

concurrency:
  group: hf-space
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # HF_SPACE may be stored as a repository variable or as a secret; either works.
      HF_SPACE: ${{ vars.HF_SPACE || secrets.HF_SPACE }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Check deployment settings
        run: |
          missing=0
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Repository secret HF_TOKEN is not set (Settings > Secrets and variables > Actions > Secrets)."
            missing=1
          fi
          if [ -z "$HF_SPACE" ]; then
            echo "::error::HF_SPACE is not set. Add it as a repository variable (or secret) with the value <hf-username>/<space-name>."
            missing=1
          elif ! echo "$HF_SPACE" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::error::HF_SPACE must look like <hf-username>/<space-name>, without https:// or 'spaces/'."
            missing=1
          fi
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Space bundle
        run: python scripts/build_hf_space.py --out bundle

      - name: Push bundle to the Space
        run: |
          HF_USER="${HF_SPACE%%/*}"
          cd bundle
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "Deployed to https://huggingface.co/spaces/${HF_SPACE}"
